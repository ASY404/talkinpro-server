# Render service configuration
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: talkinpro-server
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: APP_LATEST_VERSION
        value: 1.0.0
      - key: APP_MIN_VERSION
        value: 1.0.0
      - key: FREE_ENTITLEMENT
        value: "true"
      - key: AGORA_APP_ID
        value: 84c95fd2496e403ab14776f5c74a08ca
      - key: AGORA_APP_CERTIFICATE
        value: efd9bd2ff054416caf3bcfcfcd1c3c2a
      - key: TENCENT_SDK_APP_ID
        value: "1721000587"
      - key: KEY_PREFIX
        value: pro_
      # These will be generated by `npm run keygen` and added manually:
      - key: APP_SIGNING_SECRET
        sync: false
      - key: ENTITLEMENT_PUBLIC_KEY_HEX
        sync: false
      - key: ENTITLEMENT_PRIVATE_KEY_HEX
        sync: false
      - key: TENCENT_MSG_KEY
        sync: false
      - key: APP_DOWNLOAD_URL
        sync: false
      - key: FIREBASE_CREDENTIALS
        sync: false
